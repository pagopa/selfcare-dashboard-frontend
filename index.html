    <!-- Fix: Periodically attempts to unlock body/html scroll by removing overflow:hidden if blocked. -->
    <script>
      (function () {
        function unlockScroll() {
          var body = document.body;
          var html = document.documentElement;
          if (body && body.style.overflow === 'hidden') {
            body.style.removeProperty('overflow');
          }
          if (html && html.style.overflow === 'hidden') {
            html.style.removeProperty('overflow');
          }
        }

        function startUnlockChecks() {
          // Staggered checks for immediate responsiveness
          setTimeout(unlockScroll, 500);
          setTimeout(unlockScroll, 1500);
          setTimeout(unlockScroll, 3000);
          
          // Periodic check every 2 seconds to ensure scroll isn't blocked
          var intervalId = setInterval(unlockScroll, 2000);

          // Stop checking after 10 seconds to avoid infinite polling
          setTimeout(function () {
            clearInterval(intervalId);
          }, 10000);
        }

        // Start checks as soon as the DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', startUnlockChecks);
        } else {
          startUnlockChecks();
        }
      })();
    </script>
  </head>
  <body>

  </body>
